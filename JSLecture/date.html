<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h1>date and time</h1>
    <p id="time"></p>
    <script>
        let todayDate = new Date()
        console.log(todayDate);  
       
        let fullYear = todayDate.getYear()
        console.log(fullYear);
       
        let fullMonth = todayDate.getMonth()
        console.log(fullMonth+1);
       
        let fullDate = todayDate.getDate()
        console.log(fullDate);
       
        let getDay = todayDate.getDay()
        console.log(getDay);
       
        let getHour = todayDate.getHours()
        console.log(getHour);
       
        let getMin = todayDate.getMinutes()
        console.log(getMin);

        let getSec = todayDate.getSeconds()
        console.log(getSec);

        let timeFormat = todayDate.toLocaleTimeString()
        console.log(timeFormat);

        function timeinterval(){
            let date = new Date ()
            let clock = date.toLocaleTimeString()
            let myP = document.getElementById('time')
            myP.innertext = clock
        }
        setInterval(timeinterval,1000)
        document.write("time")
        
        

        
        
    </script>
    
</body>
</html>
