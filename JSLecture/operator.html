<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h1>Operator Lessson</h1>
    <script>
        // assign operator ဆိုတာ = ကိုပြောတာပါ
        let name ="kyaw Gyi"
        console.log(name);

        // addition operator ဆိုတာ + ကိုပြောတာပါ
        let number = 31 + 42
        console.log(number);
        // ပေါင်းလိုမရပါ အောက်က
        let fivefour = "31" + 42
        console.log(fivefour);
        let no =7
        console.log(no); // 7
        // no = no+3 //‌ရေးတဲ့နည်း same
        no +=3
        console.log(no);
        let num = 5

        console.log(num++)
        console.log(num);
        console.log(++num);

        // subtraction
        let sub = 10 -5
        let num1= 4
        let result = sub - num1
        console.log(sub);
        console.log(result);

        // multiplocation operator -* အမြှာက် SIng
        let multi = 5*5
        console.log(multi);
        multi *=5 // multi = mulit *5 Sing
        console.log(multi);

        // division operator /အစား Sing
        let div = 10/2
        console.log(div);

        // remainder operator % အကြွင်း Sing
        let remainder = 10%3
        console.log(remainder);

        //exponent operator ** အထက်ကိန်ရေးနည်း Sing
        let exp=12**5
        console.log(exp);

        // presendence operator )()*%+- အဆင်လိုက် အလုပ်ပါတယ် sing
        let pre = (4+5) -2 * 5 / 2 % 3
        console.log(pre);
        
        </script>
    
</body>
</html>
