<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h1>logical operator</h1>
    <script>
        //Or Operator(||)ရေးနည်း တစ်ခုထက်မကတဲ သုံးတယ် ၃ခုမှာတစ်ခုမှန်ရင် true ထုတ်ပေးတယ် 
        let num1  = 10
        let num2  = 20
        let num3  = 30
//eq (true ||true ||false)answer=true
        console.log(num1<num2 || num3==num2 || num2<num1);//မှန်ရင် true မှားရင် false

        //and operator (&&)ရေးနည်း ၃ခုမှာတစ်ခုမှာရင် false ထုတ်ပေးတယ်
        //eq (true && true &&false)answer=false
        console.log(num1<num2 && num3==num2 && num2<num1);

        // NOT Operator (!(numbar>number))ရေးနည်း
        let num4 = 40
        console.log(!(num4>num3));
        

        
    </script>
</body>
</html>
