<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h1>comparsion Lessson</h1>
    <script>
        //greather than ( > )
        let a = "10"
        let b = 10
        console.log(a > b); // မှန်ရင် true မှားရင် false

        //greather then Equal (>=)
        console.log(a >= b);// မှန်ရင် true မှားရင် false

        //less than (<)
        console.log(a < b);// မှန်ရင် true မှားရင် false

        // less than (<=)
        console.log(a <= b);// မှန်ရင် true မှားရင် false
        
        //equal (==)
        console.log(a == b);// မှန်ရင် true မှားရင် false

        // triple equal (===) Data Type ‌ရော် vale

        console.log(a === b);// မှန်ရင် true မှားရင် false

        // Not Equal (!=)valueဘဲအလုပ်လုပ်တာ မညီမျှ ပါ ဆိုတဲ sing

        console.log(a != b);// မှန်ရင် true မှားရင် false

        //not double equal (!==) နှစ်ခု အလုပ် လုပ်ပါတယ် 

        console.log(a !== b );// မှန်ရင် true မှားရင် false
        
        
        
        
        

        

        
    </script>
    
</body>
</html>
