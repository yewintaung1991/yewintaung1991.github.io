<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>

    <p>Lorem ipsum, dolor sit amet consectetur adipisicing elit. Delectus quo necessitatibus dolore quidem beatae recusandae sapiente omnis rerum tenetur accusamus voluptatem consequatur doloremque, nostrum vero repudiandae sequi est corrupti sunt.</p>
    <button id="hide">hide</button>
    <button id="show">show</button>
    <button id="toggle">toggle</button>
    <button id="fadeIn">fadeIn</button>
    <button id="fadeOut">fadeOut</button>
    <button id="fadeToggle">fadeToggle</button>
    <button id="fadeTo">fadeTo</button> 


    <script src="jquery-4.1.0.min.js"></script>

<script>    
    $(document).ready(function(){
        $("#hide").click(function(){
            $("p").hide(2000)})
            $("#show").click(function(){
                $("p").show(2000)
            })
            $("#toggle").click(function(){
                $("p").toggle(2000)
            })
            $("#fadeIn").click(function(){
                $("p").fadeIn(2000)
            })
            $("#fadeOut").click(function(){
                $("p").fadeOut(2000)
            })
            $("#fadeToggle").click(function(){
                $("p").fadeToggle(2000)
            })
            $("fadeTo").click(function(){
                $("p").fadeTo(30002000)
            })
            $("#slideUp").click(function(){
                $("p").slideUp(2000)
            })
                
           
    })
    </script>
</body>
</html>
