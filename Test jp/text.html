<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
    <link rel="stylesheet" href="text.css">
</head>
<body>
    <main class="homework">
        <h1>Welcome Back!</h1>
        <p class="subtitle">Please login to your account</p>

        <form id="login-form">
            <div class="form-group">
                <label for="email">Email Address</label>
                <input type="email"
                       id="email"
                       name="email"
                       placeholder="Enter your email"
                       required>
            </div>

            <div class="form-group">
                <label for="password">Password</label>
                <input type="password"
                       id="password"
                       name="password"
                       placeholder="Enter your password"
                       required>
            </div>

            <div class="form-options">
                <label class="remember-me">
                    <input type="checkbox" name="remember">
                    <span>Remember me</span>
                </label>

                <a href="#" class="forgot-password">Forgot Password?</a>
            </div>

            <button type="submit" class="btn-login">Login</button>
        </form>
    </main>

    <aside class="mode-side" aria-label="Display mode">
        <button type="button" id="mode-toggle" aria-label="Switch to dark mode" aria-pressed="false">
            <span class="mode-icon" aria-hidden="true">☾</span>
            <span class="mode-label">Dark mode</span>
        </button>
    </aside>

    <style>
        .mode-side {
            position: fixed;
            right: 16px;
            top: 50%;
            transform: translateY(-50%);
        }

        #mode-toggle {
            display: flex;
            align-items: center;
            gap: 8px;
            border: 1px solid #d1d5db;
            border-radius: 999px;
            padding: 10px 14px;
            background: #fff;
            color: #111827;
            box-shadow: 0 4px 16px rgba(0, 0, 0, 0.12);
            cursor: pointer;
        }

        body.dark-mode {
            background: #111827;
            color: #f9fafb;
        }

        body.dark-mode .homework {
            background: #1f2937;
        }

        body.dark-mode #mode-toggle {
            border-color: #4b5563;
            background: #1f2937;
            color: #f9fafb;
        }

        @media (max-width: 640px) {
            .mode-side {
                right: 12px;
                top: 12px;
                transform: none;
            }

            .mode-label {
                display: none;
            }

            #mode-toggle {
                width: 44px;
                height: 44px;
                justify-content: center;
                padding: 0;
            }
        }
    </style>

    <script>
        const modeToggle = document.getElementById('mode-toggle');
        const modeIcon = modeToggle.querySelector('.mode-icon');
        const modeLabel = modeToggle.querySelector('.mode-label');

        function setMode(isDark) {
            document.body.classList.toggle('dark-mode', isDark);
            modeToggle.setAttribute('aria-pressed', String(isDark));
            modeToggle.setAttribute('aria-label', isDark ? 'Switch to light mode' : 'Switch to dark mode');
            modeIcon.textContent = isDark ? '☀' : '☾';
            modeLabel.textContent = isDark ? 'Light mode' : 'Dark mode';
        }

        modeToggle.addEventListener('click', () => {
            const isDark = !document.body.classList.contains('dark-mode');
            setMode(isDark);
            localStorage.setItem('display-mode', isDark ? 'dark' : 'light');
        });

        setMode(localStorage.getItem('display-mode') === 'dark');
    </script>
    
</body>
</html>
